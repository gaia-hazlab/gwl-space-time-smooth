name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reproduce the pinned environment from pixi.lock (git deps are pinned to commit SHAs).
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          frozen: true
          cache: true

      # The whole test suite is offline (every test builds synthetic inputs); codameter/disba-dependent
      # tests SKIP visibly rather than passing silently. This is the regression gate for the assimilation,
      # water budget, hysteresis, and domain invariants.
      - name: Run tests
        run: pixi run test

  check-dois:
    runs-on: ubuntu-latest
    # Loose cap so a hung checkout/env-solve cannot burn 6 hours; the tight bound that
    # actually matters is on the network step below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          frozen: true
          cache: true

      # references.bib has a history of fabricated/wrong DOIs (#158). This resolves every DOI
      # against doi.org, so an unregistered (fabricated, unresolvable) DOI fails red. It does NOT
      # check that a DOI points at the cited paper -- 5 of the 9 documented DOI defects were
      # registered DOIs for unrelated papers and would pass this gate; that check stays manual.
      # (A tenth FIXED entry, mckee1993spi, was a fabricated *title* on an entry that carries no
      # DOI at all, so it is outside this gate's scope either way.)
      #
      # 71 DOIs + 2 canaries, x (RETRIES + 1) attempts x 15 s, is ~55 min of runner time during a
      # doi.org outage. The cap belongs on this step, not the job: the job also pays for checkout
      # and a cold-cache pixi solve/install of a large env (pygmt, cartopy, obspy, geopandas,
      # xgboost, ... + 2 git deps), which can legitimately take longer than the network budget and
      # must not turn this gate red for reasons unrelated to DOIs.
      - name: Verify references.bib DOIs resolve
        timeout-minutes: 10
        run: pixi run check-dois
