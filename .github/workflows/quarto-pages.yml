name: Render & Publish Quarto Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/quarto-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies for figures
        run: pip install jupyter matplotlib numpy scipy scikit-learn

      # The legacy single-file report (old/docs/gwl_hybrid_framework.qmd) is ARCHIVED and no longer
      # re-rendered on CI: its committed snapshot docs/gwl_hybrid_framework.html is served as-is at
      # /report.html (see the staging step). The multi-doc site under /twin/ is the primary docs.

      # The multi-doc site is the primary documentation (linked chapters). It is a Quarto website
      # project; render it to docs/twin/_site and serve it at /twin/. continue-on-error so a chapter
      # render failure does not take the whole Pages deploy down.
      - name: Render multi-doc site
        id: site
        continue-on-error: true
        run: quarto render docs/twin

      # A ::warning annotation alone is easy to miss (the job still shows green because of
      # continue-on-error above, and the annotation only shows up if someone opens this run).
      # Also write to the job summary, which is shown on the run's main page.
      - name: Warn if the site render failed
        if: steps.site.outcome == 'failure'
        run: |
          echo "::warning title=Multi-doc site render failed::The /twin/ chapters were not deployed this run; a placeholder page was published instead."
          echo "### :warning: Multi-doc site (\`/twin/\`) failed to render" >> "$GITHUB_STEP_SUMMARY"
          echo "The rest of the site (landing page, /report.html, demo pages) still deployed. \`/twin/\` was replaced with a placeholder notice instead of the last successful render — see the \`quarto render docs/twin\` step log above for the error." >> "$GITHUB_STEP_SUMMARY"

      - name: Stage for Pages
        run: |
          mkdir -p _site
          # Landing page (hand-written, static — no Quarto render, so it deploys even if a render
          # fails) links everything from one URL: https://gaia-hazlab.github.io/gwl-space-time-smooth/
          cp docs/index.html _site/index.html
          # Archived single-file technical report at /report.html — freshly rendered if the render
          # step succeeded, else the committed copy. Conditional so a missing HTML never fails deploy.
          if [ -f docs/gwl_hybrid_framework.html ]; then cp docs/gwl_hybrid_framework.html _site/report.html; fi
          # Pre-rendered, self-contained pages (figures/GIFs come from gitignored real-data products,
          # so they are served as committed rather than re-rendered on CI).
          for f in gwl_soil_moisture_demo gwl_audit_framework; do
            if [ -f "docs/$f.html" ]; then cp "docs/$f.html" "_site/$f.html"; fi
          done
          # Per-issue dashboards committed by scripts/gaia_run_queue.sh (docs/gaia-runs/issue-<n>/
          # <timestamp>/dashboard.html), each already self-contained -- served as committed, plus a
          # generated index linking every one, at /gaia-runs/.
          if [ -d docs/gaia-runs ]; then
            mkdir -p _site/gaia-runs
            cp -r docs/gaia-runs/. _site/gaia-runs/
            python3 scripts/gaia-launch/gaia_runs_site_index.py docs/gaia-runs _site/gaia-runs/index.html
          fi

      # Publish the multi-doc site at /twin/ ONLY when its render succeeded — Quarto can leave a
      # partial _site/ behind on failure, so a bare directory check would deploy a broken /twin/.
      - name: Stage the multi-doc site (only on a clean render)
        if: steps.site.outcome == 'success'
        run: cp -r docs/twin/_site _site/twin

      # Without this, a failed render means /twin/ is simply absent from the artifact, and because
      # actions/deploy-pages replaces the whole published site rather than merging into it, the
      # PREVIOUSLY published /twin/ disappears (404) with no visible signal to a site visitor — the
      # step-summary/annotation above is only visible in the Actions run, not on the site. Publish a
      # plain notice in its place instead of leaving the path silently missing.
      - name: Stage a placeholder for the multi-doc site (render failed)
        if: steps.site.outcome == 'failure'
        run: |
          mkdir -p _site/twin
          cat > _site/twin/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Documentation render failed</title></head>
          <body style="font-family: sans-serif; max-width: 40em; margin: 3em auto;">
          <h1>The documentation site failed to render</h1>
          <p>The last CI run of the multi-chapter documentation (<code>docs/twin/</code>) did not
          render successfully, so this page is a placeholder rather than the previously published
          chapters. See the <a href="https://github.com/gaia-hazlab/gwl-space-time-smooth/actions/workflows/quarto-pages.yml">quarto-pages workflow runs</a> for the render error.</p>
          <p><a href="../">Back to the landing page</a></p>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
